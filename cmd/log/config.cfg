# 日志独立应用示例配置

[app]
    name = LogDemoApp
    version = 1.0.0

[log]
    level = debug
    async = true
    caller = true

# 多输出流配置
[[log.streams]]
    type = console
    level = debug
    color = true

[[log.streams]]
    type = file
    level = info
    file = ./logs/app_info.log
    max_size = 10
    max_backups = 5

[[log.streams]]
    type = file
    level = error
    file = ./logs/app_error.log
    max_size = 10
    max_backups = 10
