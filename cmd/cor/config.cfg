# Cor 框架全功能演示配置

[app]
    name = CorFullDemo
    version = 2.0.0
    env = production
    description = "这是一个演示 cnl/cor 框架统一初始化和各模块协作的示例应用"

[server]
    host = 0.0.0.0
    port = 8080
    timeout = 30s

[log]
    level = info
    async = true
    caller = true

# 多输出流配置：同时输出到控制台和文件
[[log.streams]]
    type = console
    level = debug
    color = true

[[log.streams]]
    type = file
    level = warn
    file = ./logs/warn_error.log
    max_size = 20
    max_backups = 3

[database]
    driver = mysql
    host = localhost
    port = 3306
    user = root
    password = "${DB_PASSWORD:secret_key}" # 演示环境变量扩展
    pool {
        max_open = 100
        max_idle = 10
        idle_timeout = 5m
    }
