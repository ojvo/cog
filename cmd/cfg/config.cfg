# ==========================================
# Cfg Complete Configuration Example
# ==========================================

# 1. Global Settings (Dotted Paths - No Indentation)
app.name = CfgDemo
app.version = 2.0.0
app.env = production

# 2. Server Configuration (HCL-style Braces)
server {
    host = 0.0.0.0
    port = 8080
    
    # Nested Path inside Braces
    timeout.read = 30s
    timeout.write = 60s
    
    # Sub-scope
    ssl {
        enabled = true
        cert = /etc/ssl/certs/server.crt
        key = /etc/ssl/private/server.key
    }
}

# 3. Database Cluster (Mixed Traditional & Dotted)
[database]
    driver = postgres
    host = db.example.com
    port = 5432
    
    # Traditional nested section
    [database.pool]
        max_open = 100
        max_idle = 20
        max_lifetime = 1h

# 4. Multiline Strings (Block Strings)
app.motd = """
Welcome to Cfg 2.0!
--------------------
This is a multiline message of the day.
It supports:
  - Preserved indentation
  - Newlines
  - Special characters
"""

# 5. Services List (Path-based Slices)
[[services]]
    name = auth-service
    endpoint = http://auth:9000
    tags = security, core

[[services]]
    name = payment-gateway
    endpoint = http://pay:9001
    tags = finance, external

# 6. Logging Configuration (Added for demo)
[log]
    level = debug
    caller = true
    async = true
    # file = app.log

# 6. Environment Variables (Substitution)
# Requires OS env vars: APP_LOG_LEVEL, DB_PWD
log.level = ${APP_LOG_LEVEL:info}
database.password = ${DB_PWD:secret123}
